<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Developer Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        
        <div class="avatar-container">
            <!-- Replace the src with your own image URL -->
            <img src="aishwarya_pic.jpg" alt="Developer Avatar" class="avatar">
            <div class="status-indicator" title="Available for Work"></div>
        </div>
        
        <div class="profile-info">
            <h1 class="name">Aishwarya A S</h1>
            <h2 class="title">Second-Year Student & Front-End Developer</h2>
            <p class="bio">Passionate about creating interactive and interesting web experiences. Always learning, always coding.</p>
        </div>
        
        <div class="skills">
            <span class="badge">HTML5</span>
            <span class="badge">CSS3</span>
            <span class="badge">JavaScript</span>
            <span class="badge">C++</span>
        </div>
        
        <div class="actions">
            <a href="https://github.com/aishwarya858" target="_blank" class="btn btn-primary">GitHub</a>
            <a href="https://www.linkedin.com/in/aishwarya-a-s09/" target="_blank" class="btn btn-secondary">LinkedIn</a>
        
    </div>
</body>
</html>
